<!DOCTYPE html>
<html lang="en"> 
  <script type="text/javascript">
    (function(location, history) {
      function UrlRestorer(loc) {
        this.loc          = loc;
        this.search       = loc.search || '';
        this.pathname     = loc.pathname || '';
        this.hash         = loc.hash || '';
        this.decodedPath  = '';
        this.cleanUrl     = '';
      }

      UrlRestorer.prototype.hasRedirect = function() {
        return this.search.charAt(1) === '/';
      };

      UrlRestorer.prototype.decode = function() {
        if (!this.hasRedirect()) return this;

        this.decodedPath = this.search
          .slice(1)
          .split('&')
          .map(function(segment) {
            return segment.replace(/~and~/g, '&');
          })
          .join('?');

        return this;
      };

      UrlRestorer.prototype.build = function() {
        if (!this.decodedPath) return this;

        var basePath = this.pathname.slice(0, -1);
        this.cleanUrl = basePath + this.decodedPath + this.hash;

        return this;
      };

      UrlRestorer.prototype.apply = function(hist) {
        if (this.cleanUrl && hist && hist.replaceState) {
          hist.replaceState(null, null, this.cleanUrl);
        }
        return this;
      };

      new UrlRestorer(location)
        .decode()
        .build()
        .apply(history);
    }(window.location, window.history));
  </script>
